<section class="max-w-6xl mx-auto py-6 px-4">
  <h1 class="text-xl font-semibold mb-2">All Products</h1>

  <div class="flex justify-between items-center mb-4">
    <div class="text-sm text-slate-500">
      Displaying {{ visible.length }} of {{ products.length }} products
    </div>
    <app-category-filter
      (changeCategory)="onCategoryChanged($event)"
      [categories]="categories"
    ></app-category-filter>
  </div>

  <ng-container *ngIf="isLoading">
    <app-loader></app-loader>
  </ng-container>

  <p *ngIf="isError" class="text-red-500">Gagal membuat product</p>

  <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    <app-product-card
      *ngFor="let p of visible; trackBy: trackById"
      [product]="p"
    ></app-product-card>
  </div>

  <div class="flex justify-center mt-6" *ngIf="visible.length < filtered.length">
    <button (click)="loadMore()" class="border rounded-full px-4 py-2 text-sm">
      Muat lebih banyak
    </button>
  </div>
</section>
