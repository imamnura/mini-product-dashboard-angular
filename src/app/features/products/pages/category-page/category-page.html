<div class="max-w-6xl mx-auto px-4 py-6">
  <!-- Loading State -->
  <app-loading-spinner *ngIf="isLoading" message="Loading products..."></app-loading-spinner>

  <!-- Error State -->
  <app-error-state
    *ngIf="isError && !isLoading"
    message="Failed to load products. Please try again."
    (retry)="retryLoad()"
  ></app-error-state>

  <!-- Category Products -->
  <div *ngIf="!isLoading && !isError">
    <!-- Header with Search -->
    <div class="mb-6">
      <h1 class="text-2xl font-semibold mb-2">{{ category | titlecase }}</h1>
      <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">
        {{ filteredProducts.length }} products found
      </p>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        placeholder="Search products..."
        class="border rounded-lg px-4 py-2 w-full md:w-96 bg-white dark:bg-slate-800 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-orange-400"
      />
    </div>

    <!-- Product Grid -->
    <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      <app-product-card *ngFor="let product of visible" [product]="product"></app-product-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="visible.length === 0" class="text-center py-10">
      <p class="text-slate-500">No products found matching your search.</p>
    </div>

    <!-- Pagination -->
    <app-pagination
      [currentPage]="currentPage"
      [totalItems]="filteredProducts.length"
      [itemsPerPage]="itemsPerPage"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</div>
