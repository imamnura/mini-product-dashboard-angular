<div class="min-h-[60vh] flex flex-col items-center justify-center px-4 text-center">
  <div class="mb-8">
    <h1 class="text-9xl font-bold text-orange-500">404</h1>
    <h2 class="text-3xl font-semibold text-slate-800 dark:text-slate-200 mt-4">Page Not Found</h2>
    <p class="text-slate-600 dark:text-slate-400 mt-2 max-w-md">
      The page you're looking for doesn't exist or has been moved.
    </p>
  </div>

  <div class="flex gap-4">
    <a
      routerLink="/"
      class="px-6 py-3 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition-colors font-medium"
    >
      Go Home
    </a>
    <button
      (click)="goHome()"
      class="px-6 py-3 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors font-medium"
    >
      Back
    </button>
  </div>
</div>
