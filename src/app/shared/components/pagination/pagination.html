<div class="flex justify-center items-center gap-2 mt-8" *ngIf="totalPages > 1">
  <!-- Previous Button -->
  <button
    (click)="previousPage()"
    [disabled]="currentPage === 1"
    class="px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    aria-label="Previous page"
  >
    ← Prev
  </button>

  <!-- Page Numbers -->
  <button
    *ngFor="let page of pages"
    (click)="goToPage(page)"
    [class.bg-orange-500]="page === currentPage"
    [class.text-white]="page === currentPage"
    [class.hover:bg-slate-100]="page !== currentPage"
    [class.dark:hover:bg-slate-800]="page !== currentPage"
    class="px-4 py-2 rounded-md border border-slate-300 dark:border-slate-600 transition-colors"
  >
    {{ page }}
  </button>

  <!-- Next Button -->
  <button
    (click)="nextPage()"
    [disabled]="currentPage === totalPages"
    class="px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    aria-label="Next page"
  >
    Next →
  </button>
</div>
